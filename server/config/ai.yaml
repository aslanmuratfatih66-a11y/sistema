# ai.yaml — модели ИИ по задачам, цены, бюджет (SPEC §9.1).
# Значения по умолчанию вшиты в бинарник. Чтобы поменять на сервере — правьте /opt/sistema/config/ai.yaml
# (каталог SISTEMA_CONFIG_DIR) и перезапустите сервис: sudo systemctl restart sistema.
# Поверх этого файла действуют переменные .env: SISTEMA_AI_MODELS («задача=модель,…») и SISTEMA_AI_BUDGET_USD.
# Ключи API здесь НЕ хранятся — только в .env.
#
# Сверено с документацией 2026-10-22:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   Google:    https://ai.google.dev/gemini-api/docs/models , https://ai.google.dev/gemini-api/docs/pricing

# Версия Messages API Anthropic (заголовок anthropic-version). С 2026-10-21 вышла новая версия «2026-10-21»
# (убраны temperature/top_p/top_k — мы их не шлём); переход — после проверки с живым ключом.
anthropic_version: "2023-06-01"

# Бюджет на весь сервер (все пользователи), USD.
budget:
  monthly_usd: 27        # жёсткий месячный лимит: дальше ИИ выключен до 1-го числа (клиент — на шаблонах)
  daily_usd: 1.8         # мягкий дневной лимит: при превышении — понижение моделей (см. degrade)
  daily_hard_usd: 3.5    # жёсткий дневной лимит: дальше ИИ выключен до полуночи UTC
  degrade_at: 0.8        # доля месячного лимита, после которой включается понижение моделей

# Понижение при приближении к лимиту (задача → модель). Задачи, которых нет в списке, не меняются.
degrade:
  character: claude-sonnet-5-5
  chat: claude-sonnet-5-5
  analyst: claude-sonnet-5-5
  body_vision: claude-opus-5-5

# Задачи → модель. provider: anthropic | gemini (пусто — по имени модели).
# no_key_fallback — модель другого провайдера, если ключа «своего» нет (например, нет ключа Gemini).
# effort — глубина рассуждения (low | medium | high), влияет на расход токенов.
tasks:
  character:     # персонаж: разговоры, реплики с характером
    model: claude-opus-5-5
    effort: low
  chat:          # старое имя задачи персонажа (совместимость) — держите равным character
    model: claude-opus-5-5
    effort: low
  analyst:       # аналитик: анализ дня, разбор недели, оценка прогресса (строгий JSON)
    model: claude-opus-5-5
    effort: medium
  analysis:      # прочий разбор данных: финансы (лимиты, отчёты), маркет (подбор товаров)
    model: claude-sonnet-5-5
    effort: low
  plan:          # построение и пересмотр плана
    model: claude-sonnet-5-5
    effort: medium
  plan_edit:
    model: claude-sonnet-5-5
    effort: low
  messages:      # сообщения наперёд (брифинг, подбадривания, упрёки)
    model: claude-sonnet-5-5
    effort: low
  learning:      # курсы, уроки, проверки
    model: claude-sonnet-5-5
    effort: low
  short:         # короткие шаблонные реплики
    model: claude-haiku-5-5
    effort: low
  bank_parse:    # разбор уведомлений/SMS банков, выписок
    model: claude-haiku-5-5
    effort: low
  body_vision:   # фото тела и кожи: оценки, асимметрия, сравнение
    model: claude-fable-5-1
    effort: medium
  food_vision:   # фото еды и чеков
    model: gemini-4-argon
    provider: gemini
    no_key_fallback: claude-sonnet-5-5
  food_lookup:   # поиск КБЖУ купленного блюда/товара (веб-поиск)
    model: gemini-4-argon
    provider: gemini
    no_key_fallback: claude-sonnet-5-5

# Цены, USD за 1 млн токенов. cache_write — запись в кэш на 5 минут (1.25× входа).
# long_above — порог длины промпта (токены), после которого действуют long_* (только Haiku 5.5).
# changes — будущие изменения цены с даты (UTC).
prices:
  claude-fable-5-1:  {in: 10, out: 50, cache_read: 0.25, cache_write: 12.5}
  claude-opus-5-5:   {in: 4, out: 20, cache_read: 0.20, cache_write: 5}
  claude-sonnet-5-5: {in: 2, out: 10, cache_read: 0.10, cache_write: 2.5}
  claude-haiku-5-5:
    {in: 0.10, out: 0.50, cache_read: 0.01, cache_write: 0.125,
     long_above: 100000, long_in: 0.50, long_out: 2.50, long_cache_read: 0.05, long_cache_write: 0.625}
  # Запасные модели серверного фолбэка Anthropic (при отказе классификатора) — для учёта расходов.
  claude-opus-5:     {in: 5, out: 25, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-8:   {in: 5, out: 25, cache_read: 0.50, cache_write: 6.25}
  claude-sonnet-5:   {in: 2, out: 10, cache_read: 0.20, cache_write: 2.5}
  # Gemini: кэш только неявный (запись не оплачивается отдельно). Токены рассуждения — по цене выхода.
  gemini-4-argon:
    in: 2
    out: 10
    cache_read: 0.10
    changes:
      - {from: "2026-12-01", in: 4, out: 20, cache_read: 0.20}
  gemini-3.8-flash:
    in: 0.75
    out: 3.75
    cache_read: 0.075
    changes:
      - {from: "2027-01-01", in: 1.50, out: 7.50, cache_read: 0.15}
  gemini-3.5-flash-lite: {in: 0.30, out: 2.50, cache_read: 0.03}

# Цена одного веб-поиска, USD. Anthropic: $10 / 1000. Google: $14 / 1000 сверх 5000 бесплатных в месяц
# (бесплатные не учитываем — оценка с запасом).
web_search_usd:
  anthropic: 0.01
  gemini: 0.014

# Слепой тест моделей (server/cmd/aibench): какие модели сравнивать по умолчанию.
bench:
  character_models: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-1, claude-haiku-5-5]
  food_models: [gemini-4-argon, gemini-3.8-flash, claude-sonnet-5-5, claude-opus-5-5]
