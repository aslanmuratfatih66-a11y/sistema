openapi: 3.1.0
info:
  title: Sistema API
  version: 0.5.0
  description: |
    API сервера «Система» (SPEC §10). Ошибки — {"error":"<код>"}; 429 — с заголовком Retry-After (сек).
    Время в синхронизации — миллисекунды Unix UTC. Bearer — access-токен (15 мин), refresh — 60 дней с ротацией.
servers:
  - url: http://127.0.0.1:8087
    description: Локально на сервере (снаружи — HTTPS через reverse-proxy, deploy/https.md)
paths:
  /healthz:
    get:
      summary: Проверка здоровья
      operationId: healthz
      tags: [service]
      responses:
        "200":
          description: Сервер работает
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/ping:
    get:
      summary: Проверка доступности API v1
      operationId: ping
      tags: [service]
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                type: object
                required: [pong]
                properties:
                  pong:
                    type: string
                    example: ok

  /api/v1/auth/register:
    post:
      summary: Регистрация (имя 3–32 — буквы, цифры, _ - .; пароль ≥ 8)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "201":
          description: Вошли
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tokens"}
        "400": {description: "invalid_name | invalid_password | bad_json"}
        "409": {description: "name_taken"}
        "429": {description: "rate_limited"}
  /api/v1/auth/login:
    post:
      summary: Вход (totp обязателен, если включён)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "200":
          description: Вошли
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tokens"}
        "401": {description: "invalid_credentials | totp_required | invalid_totp"}
        "429": {description: "rate_limited"}
  /api/v1/auth/refresh:
    post:
      summary: Новая пара токенов (старый refresh отзывается)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tokens"}
        "401": {description: "invalid_refresh"}
  /api/v1/auth/logout:
    post:
      summary: Отзыв текущей сессии
      tags: [auth]
      security: [{bearer: []}]
      responses:
        "200": {description: "{\"ok\":true}"}
  /api/v1/auth/me:
    get:
      summary: Текущий пользователь
      tags: [auth]
      security: [{bearer: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /api/v1/auth/totp/setup:
    post:
      summary: Секрет и otpauth:// URI для QR (включается после confirm)
      tags: [auth]
      security: [{bearer: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: {type: string}
                  uri: {type: string}
        "409": {description: "totp_already_enabled"}
  /api/v1/auth/totp/confirm:
    post:
      summary: Подтвердить TOTP кодом
      tags: [auth]
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        "200": {description: "{\"ok\":true,\"totp_enabled\":true}"}
        "400": {description: "totp_not_setup"}
        "401": {description: "invalid_totp"}
  /api/v1/auth/reset:
    post:
      summary: Сброс пароля по TOTP (все сессии отзываются)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, totp, new_password]
              properties:
                name: {type: string}
                totp: {type: string}
                new_password: {type: string}
      responses:
        "200": {description: "{\"ok\":true}"}
        "401": {description: "invalid_credentials"}

  /api/v1/sync/push:
    post:
      summary: Отправить изменения (≤ 1000). LWW по полю; quest_events — только вставка
      tags: [sync]
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, changes]
              properties:
                device_id: {type: string}
                changes:
                  type: array
                  items: {$ref: "#/components/schemas/Change"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: {type: integer}
                  cursor: {type: integer, description: "seq пользователя (не курсор pull)"}
        "413": {description: "больше 1000 изменений"}
  /api/v1/sync/pull:
    get:
      summary: Изменения после курсора (полное состояние записей, по seq)
      tags: [sync]
      security: [{bearer: []}]
      parameters:
        - {name: since, in: query, schema: {type: integer, default: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 500, maximum: 1000}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items: {$ref: "#/components/schemas/Change"}
                  cursor: {type: integer}
                  has_more: {type: boolean}

  /api/v1/photos/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9-]{1,64}$"}}
    put:
      summary: Загрузить фото (JPEG/PNG/WebP, сырое тело или multipart) → WebP 1600px + миниатюра 320px
      tags: [photos]
      security: [{bearer: []}]
      responses:
        "200": {description: "{id,width,height,bytes}"}
        "413": {description: "больше SISTEMA_MAX_PHOTO_BYTES"}
        "415": {description: "формат не поддерживается (HEIC и пр.)"}
        "422": {description: "больше 24 Мп"}
    get:
      summary: Фото (image/webp), только владельцу
      tags: [photos]
      security: [{bearer: []}]
      responses:
        "200": {description: "image/webp"}
        "404": {description: "нет"}
    delete:
      summary: Удалить фото
      tags: [photos]
      security: [{bearer: []}]
      responses:
        "204": {description: "удалено"}
        "404": {description: "нет"}
  /api/v1/photos/{id}/thumb:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Миниатюра (image/webp)
      tags: [photos]
      security: [{bearer: []}]
      responses:
        "200": {description: "image/webp"}
        "404": {description: "нет"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  headers:
    X-Request-Id:
      description: Идентификатор запроса (берётся из запроса, если валиден, иначе генерируется)
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
  schemas:
    Health:
      type: object
      required: [status, version, uptime_s, mem_alloc_mb]
      properties:
        status: {type: string, example: ok}
        version: {type: string, example: 0.5.0}
        uptime_s: {type: integer, format: int64, description: "Время работы процесса, секунды"}
        mem_alloc_mb: {type: number, description: "Текущая занятая куча (runtime.MemStats.Alloc), МБ"}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Credentials:
      type: object
      required: [name, password]
      properties:
        name: {type: string}
        password: {type: string}
        totp: {type: string, description: "только для login"}
        device_id: {type: string}
    User:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        totp_enabled: {type: boolean}
    Tokens:
      type: object
      properties:
        access_token: {type: string}
        access_expires_in: {type: integer, description: "секунды"}
        refresh_token: {type: string}
        user: {$ref: "#/components/schemas/User"}
    Change:
      type: object
      required: [table, id, updated_at, data]
      properties:
        table: {type: string, pattern: "^[a-z_]{1,64}$"}
        id: {type: string, maxLength: 64}
        updated_at: {type: integer, format: int64}
        deleted_at: {type: [integer, "null"], description: "в push: опустить, если не удалено; null — снять удаление"}
        version: {type: integer}
        device_id: {type: string, description: "только в pull"}
        data: {type: object, description: "колонки записи snake_case"}
