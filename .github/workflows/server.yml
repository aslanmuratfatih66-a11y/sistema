name: server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          # go.sum may be absent while the module has no dependencies.
          cache: ${{ hashFiles('server/go.sum') != '' }}
          cache-dependency-path: server/go.sum

      - run: go version
      - run: go vet ./...
      - run: go test ./...

      - name: Build linux/amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o dist/sistema-server ./cmd/sistema

      - uses: actions/upload-artifact@v7
        with:
          name: sistema-server-linux-amd64
          path: server/dist/sistema-server
          if-no-files-found: error
          retention-days: 30
