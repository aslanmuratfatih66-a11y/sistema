name: app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.x

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: app
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.p12"
          } > android/key.properties

      - name: Warn about missing keystore
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — release APK will be signed with the debug key."

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=SISTEMA_SERVER_URL=${{ vars.SISTEMA_SERVER_URL }}

      - name: Rename APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          out="build/app/outputs/flutter-apk/sistema-${short_sha}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$out"
          echo "path=app/$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: sistema-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f android/app/upload-keystore.p12 android/key.properties

  ios:
    runs-on: macos-latest
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          app_path=""
          if flutter build ipa --release --no-codesign --dart-define=SISTEMA_SERVER_URL=${{ vars.SISTEMA_SERVER_URL }}; then
            candidate="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
            if [ -d "$candidate" ]; then
              app_path="$candidate"
            fi
          fi
          if [ -z "$app_path" ]; then
            echo "::warning::xcarchive not found, falling back to 'flutter build ios'."
            flutter build ios --release --no-codesign --dart-define=SISTEMA_SERVER_URL=${{ vars.SISTEMA_SERVER_URL }}
            app_path="build/ios/iphoneos/Runner.app"
          fi
          test -d "$app_path"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Package IPA
        id: ipa
        run: |
          short_sha="${GITHUB_SHA::7}"
          rm -rf build/ipa-pkg
          mkdir -p build/ipa-pkg/Payload
          cp -R "$APP_PATH" build/ipa-pkg/Payload/
          (cd build/ipa-pkg && zip -qry "sistema-${short_sha}.ipa" Payload)
          echo "path=app/build/ipa-pkg/sistema-${short_sha}.ipa" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: sistema-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30
